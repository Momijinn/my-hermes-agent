services:
  # Hermes Agent (internal only)
  hermes:
    # Build the pinned Dockerfile instead of floating to :latest.
    build:
      context: ./hermes
      dockerfile: Dockerfile
    image: hermes-agent:2026.6.5
    container_name: hermes
    restart: unless-stopped
    command:
      - sh
      - -c
      - >-
        cp /usr/local/share/hermes/config.yaml /opt/data/config.yaml;
        exec hermes gateway run
    env_file:
      - .env
    environment:
      # Run the supported dashboard alongside the gateway in this container.
      HERMES_DASHBOARD: "1"
      HERMES_DASHBOARD_HOST: "0.0.0.0"
      HERMES_DASHBOARD_PORT: "8642"
      HERMES_DASHBOARD_PUBLIC_URL: http://localhost:8642
      # Local-only deployment: disable the dashboard auth gate explicitly.
      HERMES_DASHBOARD_INSECURE: "1"
      GATEWAY_ALLOW_ALL_USERS: "true"
      API_SERVER_ENABLED: "true"
      API_SERVER_HOST: "0.0.0.0"
      API_SERVER_PORT: "9119"
      API_SERVER_KEY: ${HERMES_API_KEY:?HERMES_API_KEY must be set}
    volumes:
      # Persist Hermes state, memories, credentials, and logs on the host.
      - "${HOME}/.hermes:/opt/data"
    ports:
      - "127.0.0.1:8642:8642"
    networks:
      - internal-net
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          python -c "import socket; [socket.create_connection((host, port), 2).close() for host, port in [('127.0.0.1', 9119), ('127.0.0.1', 8642)]]"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  # FastAPI Gateway (token validation)
  gateway:
    build: ./gateway
    ports:
      # Keep local diagnostics available without making the gateway public directly.
      - "127.0.0.1:9119:9119"
    environment:
      - GATEWAY_TOKENS=${GATEWAY_TOKENS}
      - HERMES_URL=http://hermes:9119
      - HERMES_API_KEY=${HERMES_API_KEY:?HERMES_API_KEY must be set}
      - MAX_CONTEXT_LINES=${GATEWAY_MAX_CONTEXT_LINES:-2000}
      - MAX_CONTEXT_CHARS=${GATEWAY_MAX_CONTEXT_CHARS:-200000}
    networks:
      - public-net
      - internal-net
    restart: unless-stopped
    depends_on:
      hermes:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request; urllib.request.urlopen('http://127.0.0.1:9119/health', timeout=2)
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  # Cloudflare Tunnel (secure HTTPS endpoint)
  cloudflared:
    image: cloudflare/cloudflared:2026.9.1@sha256:b269e8abd07a5bf6f3f4be65d5050b2174eca89c56a0241a8ff32a16aec454e4
    command:
      - tunnel
      - --no-autoupdate
      - run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:?CLOUDFLARE_TUNNEL_TOKEN must be set}
    networks:
      - public-net
    restart: unless-stopped
    depends_on:
      gateway:
        condition: service_healthy

networks:
  public-net:
    internal: false
  internal-net:
    # A published localhost port cannot be reached through an internal-only
    # bridge. Hermes API 9119 remains unpublished; only Dashboard 8642 is
    # explicitly forwarded above.
